<!DOCTYPE html>
    <html lang="id"
    <head>
        <title> web ucapan </title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Pinyon+Script&display=swap">
        <style>
            html{scroll-behavior:smooth}
            body{margin:0;background:#2e0710;color:#f6ead7;font-family:'Cormorant Garamond',Georgia,serif;overflow-x:hidden}
            .halaman{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
            padding:50px 20px;box-sizing:border-box;position:relative;text-align:center;
            .bungkus{filter:drop-shadow(0 16px 26px rgba(0,0,0,.55))}
            .kertas{background:#f6ead7;color:#4a1a22;padding:58px 34px;width:min(440px,84vw);box-sizing:border-box;
            opacity:0;visibility:hidden;transform:translateY(30px) rotate(-1deg);
            transition:opacity 2.4s ease,transform 2.4s ease}
            .kertas.tampil{opacity:1;visibility:visible;transform:translateY(0) rotate(-1deg)}
            .kertas p{margin:0;font-size:clamp(20px,4.6vw,26px);line-height:1.55;font-style:italic}
            .kertas h2{margin:0;font-family:'Pinyon Script',cursive;font-weight:400;font-size:clamp(38px,9vw,54px)}
            background:radial-gradient(ellipse at 50% 40%,#7a1b2e 0%,#4a0d1a 55%,#2e0710 100%)}
            #panggung{display:grid;place-items:center;width:100%}
            #panggung > *{grid-area:1/1}
            #amplop{width:min(320px,78vw);aspect-ratio:3/2;position:relative;cursor:pointer;border:0;background:none;padding:0;
                z-index:5;opacity:0;animation:munculAmplop 3s ease .5s forwards;transition:opacity 1s ease,transform .6s ease}
                @keyframes munculAmplop{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
                #amplop:hover{transform:translateY(-5px)}
                #amplop .badan{position:absolute;inset:0;background:linear-gradient(160deg,#eae5e6,#bcbcbc);border-radius:4px;box-shadow:0 22px 40px rgba(0,0,0,.6)}
                #amplop .depan{position:absolute;inset:0;z-index:2;background:linear-gradient(200deg,#eae5e6,#bcbcbc);
                clip-path:polygon(0 100%,0 38%,50% 72%,100% 38%,100% 100%)}
                #amplop .tutup{position:absolute;left:0;right:0;top:0;height:62%;background:linear-gradient(#efeeee,#dcdcdc);
                clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform 1s ease;z-index:3}
                #amplop .segel{position:absolute;left:50%;top:56%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;z-index:4;
                background:radial-gradient(circle at 35% 30%,#e5c08a,#a67c3f);color:#5a1020;display:grid;place-items:center;font-size:26px;
                    box-shadow:0 3px 8px rgba(0,0,0,.5);animation:detak 2.4s ease-in-out infinite;transition:opacity .5s}
                    @keyframes detak{50%{transform:scale(1.1)}}
                #amplop.dibuka{pointer-events:none}
                #amplop.dibuka .tutup{transform:rotateX(180deg);z-index:1}
                #amplop.dibuka .segel{opacity:0}
                #amplop.hilang{opacity:0;transform:translateY(30px)}
                .petunjuk{margin-top:32px;font-size:20px;font-style:italic;color:#d9b27c;opacity:0;transition:opacity 1.5s ease}
                    .petunjuk.tampil{opacity:.9}
                    .panah{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);color:#d9b27c;font-style:italic;font-size:19px;
                    opacity:0;transition:opacity 2s ease;pointer-events:none}
                    .panah.tampil{opacity:1}
                    .panah i{display:block;width:12px;height:12px;margin:10px auto 0;border-right:2px solid #d9b27c;border-bottom:2px solid #d9b27c;
                      transform:rotate(45deg);animation:turun 1.8s ease-in-out infinite}
                        @keyframes turun{50%{transform:translateY(8px) rotate(45deg)}}

                        /* ini buat halaman 2 bawah */
                        .perlahan{opacity:0;transform:translateY(20px);transition:opacity 2.2s ease,transform 2.2s ease}
                      .perlahan.tampil{opacity:1;transform:none}
                      .tombol-wrap{display:flex;gap:22px;margin-top:40px;justify-content:center;align-items:center;min-height:58px}
                      .tombol{font:600 22px 'Cormorant Garamond',serif;padding:12px 40px;border-radius:40px;cursor:pointer;border:1.5px solid #d9b27c}
                      #ya{background:#d9b27c;color:#2e0710;transition:transform .3s}
                      #ya:hover{transform:scale(1.08)}
                      #tidak{background:transparent;color:#d9b27c}
                      #tidak.kabur{position:fixed;z-index:20;transition:left .25s ease,top .25s ease}

                      /*buat jawaban yang yes no */
                      #jawaban{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
                         padding:24px;box-sizing:border-box;text-align:center;overflow:auto;
                          background:radial-gradient(ellipse at center,#7a1b2e,#2e0710);
                          opacity:0;visibility:hidden;transition:opacity 2.5s ease,visibility 0s 2.5s}
                        #jawaban.tampil{opacity:1;visibility:visible;transition:opacity 2.5s ease}
                        #jawaban h2{margin:0;font-family:'Pinyon Script',cursive;font-weight:400;color:#d9b27c;font-size:clamp(40px,10vw,64px)}
                        #jawaban img{max-width:min(380px,82vw);max-height:52vh;border:10px solid #f6ead7;border-radius:3px;box-shadow:0 20px 40px rgba(0,0,0,.6);
                          opacity:0;transform:scale(.92) rotate(2deg);transition:opacity 3s ease 1.2s,transform 3s ease 1.2s}
                        #jawaban.tampil img{opacity:1;transform:rotate(-1.5deg)}
                        #jawaban p{margin:0;font-size:clamp(20px,4.5vw,26px);font-style:italic;max-width:480px;opacity:0;transition:opacity 3s ease 2.4s}
                        #jawaban.tampil p{opacity:1}
                        #hati{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
                        #hati span{position:absolute;bottom:-30px;color:#e5546f;animation:naik linear forwards}
                        @keyframes naik{to{transform:translateY(-110vh) rotate(20deg);opacity:0}}

        </style>
            <body>
                <section class="halaman", id="atas">
                    <div id="panggung">
                            <button id="amplop" aria-label="Buka surat">
                        <div class="badan"></div><div class="depan"></div><div class="tutup"></div><div class="segel"></div>
                            </button>
                        <div class="bungkus"><div class="kertas" id="kertasQuotes"><p id="isiQuotes"></p></div></div>
                        </div>
                        <div class="petunjuk" id="petunjukAmplop">buka suratnya</div>
                        <div class="panah" id="panahBawah">scroll ke bawah<i></i></div>
                    </section>

                    <section class="halaman" id="bawah">
                    <div class="bungkus perlahan" id="blokTanya">
                    <div class="kertas tampil" id="kertasTanya" style="transform:rotate(1deg)"><h2 id="isiTanya"></h2></div>
                      </div>
                    <div class="tombol-wrap perlahan" id="blokTombol">
                            <button class="tombol" id="ya">Yes</button>
                            <button class="tombol" id="tidak">No</button>
                      </div>
                    </section>

                      <div id="jawaban">
                            <h2 id="judulJawab"></h2>
                                <img id="fotoJawab" alt="ga ke load brti jelek jaringan">
                                <p id="teksJawab"></p>
                        </div>
                        <div id="hati"></div>
                        <script>
                            var teksQuotes = "Selamat, anda kena prank ini web abal abal";
                            var teksTanya  = "diterima ga gua di puma informatics?";
                            var judulYes   = "";
                            var teksYes    = "MAKASEH YAKKK BROKK";
                            var gambarYes  = "reaksi gue.jpeg";
                            var gambarCadangan = 'reaksi gue.jpeg' + encodeURIComponent(
                              '<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360"><rect width="360" height="360" fill="#f6ead7"/>' +
                              '<path d="M180 300C80 225 52 170 52 130a64 64 0 0 1 128-8 64 64 0 0 1 128 8c0 40-28 95-128 170z" fill="#8e2238"/>' +
                              '<text x="180" y="338" font-family="Georgia" font-style="italic" font-size="20" fill="#4a1a22" text-anchor="middle"></text></svg>');
                            $('fotoJawab').src = gambarYes || gambarCadangan;
                            function $(id){ return document.getElementById(id); }
                            $('isiQuotes').textContent = teksQuotes;
                            $('isiTanya').textContent = teksTanya;
                            $('judulJawab').textContent = judulYes;
                            $('teksJawab').textContent = teksYes;
                            function robek(el){
                                var titik = [], n = 26;
                              for(var i = 0; i <= n; i++) titik.push((i / n * 100).toFixed(1) + '% ' + (Math.random() * 2.6).toFixed(1) + '%');
                              for(var j = n; j >= 0; j--) titik.push((j / n * 100).toFixed(1) + '% ' + (97.4 + Math.random() * 2.6).toFixed(1) + '%');
                              el.style.clipPath = 'polygon(' + titik.join(',') + ')';
                            }
                            robek($('kertasQuotes'));
                            robek($('kertasTanya'));
                            setTimeout(function(){ $('petunjukAmplop').classList.add('tampil'); }, 3200);
                            $('amplop').addEventListener('click', function(){
                              var a = this;
                              a.classList.add('dibuka');
                              $('petunjukAmplop').classList.remove('tampil');
                              setTimeout(function(){ a.classList.add('hilang'); }, 1100);
                              setTimeout(function(){ a.style.display = 'none'; $('kertasQuotes').classList.add('tampil'); }, 1900);
                              setTimeout(function(){ $('panahBawah').classList.add('tampil'); }, 6500);
                            });
                            var pengamat = new IntersectionObserver(function(daftar){
                              if(daftar[0].isIntersecting){
                                $('blokTanya').classList.add('tampil');
                                setTimeout(function(){ $('blokTombol').classList.add('tampil'); }, 1500);
                                pengamat.disconnect();
                              }
                            }, {threshold: 0.4});
                            pengamat.observe($('bawah'));
                            


                            /* tes tombol no kabur*/
                            var tidak = $('tidak');
                            function kabur(x, y){
                              var lebar = tidak.offsetWidth, tinggi = tidak.offsetHeight, pinggir = 14;
                              var kiri, atas, coba = 0;
                              do {
                                kiri = pinggir + Math.random() * (window.innerWidth - lebar - pinggir * 2);
                                atas = pinggir + Math.random() * (window.innerHeight - tinggi - pinggir * 2);
                                coba++;
                              } while(coba < 40 && Math.hypot(kiri + lebar / 2 - x, atas + tinggi / 2 - y) < 180);
                              tidak.classList.add('kabur');
                              tidak.style.left = kiri + 'px';
                              tidak.style.top = atas + 'px';
                            }
                            tidak.addEventListener('mouseenter', function(e){ kabur(e.clientX, e.clientY); });
                            tidak.addEventListener('click', function(e){ kabur(e.clientX, e.clientY); });
                            tidak.addEventListener('touchstart', function(e){
                              e.preventDefault();
                              kabur(e.touches[0].clientX, e.touches[0].clientY);
                            }, {passive: false});
                            document.addEventListener('mousemove', function(e){
                              var r = tidak.getBoundingClientRect();
                              if(Math.hypot(r.left + r.width / 2 - e.clientX, r.top + r.height / 2 - e.clientY) < 90) kabur(e.clientX, e.clientY);
                            });


                            /*tes tombol yes*/
                            $('ya').addEventListener('click', function(){
                              $('jawaban').classList.add('tampil');
                              for(var i = 0; i < 30; i++){
                                var h = document.createElement('span');
                                h.textContent = 'YEAY';
                                h.style.left = Math.random() * 100 + '%';
                                h.style.fontSize = (14 + Math.random() * 26) + 'px';
                                h.style.animationDuration = (5 + Math.random() * 5) + 's';
                                h.style.animationDelay = (Math.random() * 4) + 's';
                                $('hati').appendChild(h);
                              }
                            });




                        </script>
            </body>
    </head>
